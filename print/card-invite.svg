<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="85mm" height="55mm"
     viewBox="0 0 85 55">

  <!-- ============================================== -->
  <!-- TRACKID Sticker-Pack Invite Card                -->
  <!-- Trim: 85 × 55 mm                                -->
  <!-- ============================================== -->

  <!-- Paper background -->
  <rect width="85" height="55" fill="#ECE6DD"/>

  <!-- ===== Top hairline ===== -->
  <line x1="5" y1="5" x2="80" y2="5"
        stroke="#0D0D0D" stroke-width="0.2"/>

  <!-- ===== Header: wordmark + URL ===== -->
  <text x="5" y="10.5"
        font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="5.2" font-weight="700"
        letter-spacing="0.35" fill="#0D0D0D">TRACKID</text>

  <text x="80" y="10.5" text-anchor="end"
        font-family="'IBM Plex Mono', 'Menlo', monospace"
        font-size="2.5" font-weight="700"
        letter-spacing="0.15" fill="#0D0D0D">TRACKIDRIDERS.COM</text>

  <line x1="5" y1="12.8" x2="13" y2="12.8"
        stroke="#D4213D" stroke-width="0.5"/>
  <line x1="68" y1="12.8" x2="80" y2="12.8"
        stroke="#0D0D0D" stroke-width="0.2"/>

  <!-- ===== Headline (two lines, left column) ===== -->
  <text x="5" y="21"
        font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="6.6" font-weight="700"
        letter-spacing="-0.08" fill="#0D0D0D">SHOW US</text>
  <text x="5" y="28"
        font-family="'Space Grotesk', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="6.6" font-weight="700"
        letter-spacing="-0.08" fill="#0D0D0D">YOUR DUCK.</text>

  <line x1="5" y1="30.5" x2="12" y2="30.5"
        stroke="#D4213D" stroke-width="0.7"/>

  <!-- ===== QR block, right column ===== -->
  <rect x="58.5" y="14.5" width="18" height="18" fill="#FFFFFF"/>
  <svg x="59.5" y="15.5" width="16" height="16" viewBox="0 0 33 33"
       preserveAspectRatio="xMidYMid meet">
    <image width="33" height="33" xlink:href="qr-trackidriders.svg"/>
  </svg>

  <!-- ===== Body copy, full width below headline & QR ===== -->
  <text x="5" y="36.2"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="3" fill="#0D0D0D">Got a duck on your frame? Helmet? Toolbox?</text>
  <text x="5" y="40.4"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="3" fill="#0D0D0D">Throw a photo up here.</text>
  <text x="5" y="44.6"
        font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, sans-serif"
        font-size="3" font-weight="600" fill="#0D0D0D">Blurry is fine. Dirty is better.</text>

  <!-- ===== Registry signature slot ===== -->
  <text x="5" y="49.2">
    <tspan font-family="'IBM Plex Mono', 'Menlo', monospace"
           font-size="2.3" font-weight="700"
           letter-spacing="0.2" fill="#D4213D">REGISTRY</tspan>
    <tspan dx="3"
           font-family="'IBM Plex Mono', 'Menlo', monospace"
           font-size="3.2" font-weight="500"
           letter-spacing="0.4" fill="#0D0D0D">TKID—  _  _  _  _</tspan>
  </text>

  <!-- "SCAN" hint tucked next to TKID slot on the right -->
  <text x="80" y="49.2" text-anchor="end"
        font-family="'IBM Plex Mono', 'Menlo', monospace"
        font-size="2.1" font-weight="700"
        letter-spacing="0.3" fill="#8A8279">↗ SCAN TO UPLOAD</text>

  <!-- ===== Bottom hairline ===== -->
  <line x1="5" y1="51.5" x2="80" y2="51.5"
        stroke="#0D0D0D" stroke-width="0.2"/>
</svg>
